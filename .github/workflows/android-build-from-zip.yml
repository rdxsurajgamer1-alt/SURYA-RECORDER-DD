
name: Build Ultra Screen Recorder APK from ZIP

on:
  push:
    branches: [ main ]
    paths:
      - 'UltraScreenRecorder-Source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          test -f UltraScreenRecorder-Source.zip
          mkdir -p build-project
          unzip -q UltraScreenRecorder-Source.zip -d build-project
          test -f build-project/UltraScreenRecorder/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: build-project/UltraScreenRecorder
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Screen-Recorder-debug-APK
          path: build-project/UltraScreenRecorder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
